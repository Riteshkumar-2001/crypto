<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <title>Paper Trading — Sign in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

  <main class="login-wrap">
    <section class="trading-card login-card" aria-labelledby="login-title">

      <!-- Brand -->
      <div class="login-brand">
        <span class="login-logo"><i class="fa-solid fa-tower-broadcast"></i></span>
        <div>
          <h1 class="login-title" id="login-title">Live Ticker</h1>
          <p class="login-sub mb-0">Sign in to your paper trading account</p>
        </div>
      </div>

      <!-- Error message (shown by script on failed sign in) -->
      <div class="alert alert-danger login-error d-none" id="login-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="login-error-text">Invalid username or password.</span>
      </div>

      <!-- Form -->
      <form id="login-form" class="needs-validation" novalidate>

        <div class="mb-3">
          <label class="form-label" for="login-username">Username</label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="login-username" name="username"
              placeholder="Enter your username" autocomplete="username" autocapitalize="none"
              spellcheck="false" required autofocus>
            <div class="invalid-feedback">Please enter your username.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="login-password" name="password"
              placeholder="Enter your password" autocomplete="current-password" required>
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="show-password">
          <label class="form-check-label" for="show-password">Show password</label>
        </div>

        <button type="submit" class="btn btn-login w-100" id="login-submit">
          <i class="fa-solid fa-right-to-bracket"></i> Sign in
        </button>

      </form>

      <p class="login-foot mb-0">
        <i class="fa-solid fa-shield-halved"></i> Paper trading — no real funds at risk.
      </p>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
  <script src="assets/js/login.js"></script>

</body>

</html>
